parameters:
  - name: displayName
    type: string
    default: Generate release notes

  - name: outputFile
    type: string

  # Use .platform/release-notes/release-notes-full.md, the summary variant,
  # or an application-owned Handlebars Markdown file.
  - name: templateFile
    type: string

  - name: checkStage
    type: boolean
    default: false

  - name: overrideStageName
    type: string
    default: ''

  # Use this when the release pipeline consumes a build pipeline resource.
  - name: activeBuildReleaseId
    type: string
    default: ''

  - name: comparisonBuildReleaseId
    type: string
    default: ''

  - name: getParentsAndChildren
    type: boolean
    default: true

  - name: getAllParents
    type: boolean
    default: false

  - name: getTestedBy
    type: boolean
    default: true

  - name: getPRDetails
    type: boolean
    default: true

  - name: getPRDetailsRepositoryId
    type: string
    default: ''

  - name: getPRDetailsRefName
    type: string
    default: ''

  - name: getIndirectPullRequests
    type: boolean
    default: false

  - name: checkForManuallyLinkedWI
    type: boolean
    default: false

  - name: recursivelyCheckConsumedArtifacts
    type: boolean
    default: false

  - name: showOnlyPrimary
    type: boolean
    default: false

  - name: searchCrossProjectForPRs
    type: boolean
    default: false

  - name: sortWorkItems
    type: boolean
    default: false

  - name: sortCommits
    type: boolean
    default: false

  - name: includePartiallySuccessful
    type: boolean
    default: false

  - name: stopOnRedeploy
    type: boolean
    default: false

  - name: tags
    type: string
    default: ''

  - name: wiqlWhereClause
    type: string
    default: ''

  - name: wiqlFromTarget
    type: string
    default: WorkItems

  - name: wiqlSharedQueryName
    type: string
    default: ''

  - name: dumpPayload
    type: boolean
    default: false

  - name: payloadFile
    type: string
    default: '$(Agent.TempDirectory)\release-notes-payload.json'

  - name: maxRetries
    type: string
    default: '3'

steps:
  - task: richardfennellBM.BM-VSTS-XplatGenerateReleaseNotes.XplatGenerate-Release-Notes.XplatGenerateReleaseNotes@4
    displayName: '${{ parameters.displayName }}'
    inputs:
      outputfile: '${{ parameters.outputFile }}'
      templateLocation: File
      templatefile: '${{ parameters.templateFile }}'
      replaceFile: true
      appendToFile: false
      checkStage: ${{ parameters.checkStage }}
      overrideStageName: '${{ parameters.overrideStageName }}'
      overrideActiveBuildReleaseId: '${{ parameters.activeBuildReleaseId }}'
      overrideBuildReleaseId: '${{ parameters.comparisonBuildReleaseId }}'
      getParentsAndChildren: ${{ parameters.getParentsAndChildren }}
      getAllParents: ${{ parameters.getAllParents }}
      getTestedBy: ${{ parameters.getTestedBy }}
      getPRDetails: ${{ parameters.getPRDetails }}
      getPRDetailsRepositoryId: '${{ parameters.getPRDetailsRepositoryId }}'
      getPRDetailsRefName: '${{ parameters.getPRDetailsRefName }}'
      getIndirectPullRequests: ${{ parameters.getIndirectPullRequests }}
      checkForManuallyLinkedWI: ${{ parameters.checkForManuallyLinkedWI }}
      recursivelyCheckConsumedArtifacts: ${{ parameters.recursivelyCheckConsumedArtifacts }}
      showOnlyPrimary: ${{ parameters.showOnlyPrimary }}
      searchCrossProjectForPRs: ${{ parameters.searchCrossProjectForPRs }}
      sortWi: ${{ parameters.sortWorkItems }}
      sortCS: ${{ parameters.sortCommits }}
      considerPartiallySuccessfulReleases: ${{ parameters.includePartiallySuccessful }}
      stopOnRedeploy: ${{ parameters.stopOnRedeploy }}
      tags: '${{ parameters.tags }}'
      wiqlWhereClause: '${{ parameters.wiqlWhereClause }}'
      wiqlFromTarget: '${{ parameters.wiqlFromTarget }}'
      wiqlSharedQueryName: '${{ parameters.wiqlSharedQueryName }}'
      dumpPayloadToConsole: false
      dumpPayloadToFile: ${{ parameters.dumpPayload }}
      dumpPayloadFileName: '${{ parameters.payloadFile }}'
      maxRetries: '${{ parameters.maxRetries }}'
      stopOnError: true
