parameters:
  - name: action
    type: string
  - name: sourceOrg
    type: string
  - name: sourceProject
    type: string
  - name: repoName
    type: string
  - name: sourceAction
    type: string
  - name: resume
    type: boolean
  - name: allowPipelines
    type: boolean
  - name: dryRun
    type: boolean

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'

  - script: python -m pip install --quiet "requests>=2.31"
    displayName: Install dependencies

  # Parameters are passed via env vars (not the command line) to avoid shell injection
  - script: python scripts/repo_archive.py
    displayName: ${{ parameters.action }} (dry run = ${{ parameters.dryRun }})
    env:
      RA_ACTION: ${{ parameters.action }}
      RA_SOURCE_ORG: ${{ parameters.sourceOrg }}
      RA_SOURCE_PROJECT: ${{ parameters.sourceProject }}
      RA_REPO: ${{ parameters.repoName }}
      RA_SOURCE_ACTION: ${{ parameters.sourceAction }}
      RA_RESUME: ${{ parameters.resume }}
      RA_ALLOW_PIPELINES: ${{ parameters.allowPipelines }}
      RA_ARCHIVE_ORG: $(archiveOrg)
      RA_ARCHIVE_PROJECT: $(archiveProject)
      RA_DRY_RUN: ${{ parameters.dryRun }}
      RA_OUT: $(Build.ArtifactStagingDirectory)/repo-archive
      SOURCE_PAT: $(pat-${{ parameters.sourceOrg }})
      ARCHIVE_PAT: $(pat-${{ variables.archiveOrg }})

  - publish: $(Build.ArtifactStagingDirectory)/repo-archive
    displayName: Publish archive record
    artifact: repo-archive-$(System.StageName)-$(System.JobAttempt)
    condition: succeededOrFailed()
